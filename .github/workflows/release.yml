name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest

    steps:
      - name: Check out stable branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install release dependencies
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e '.[dev]'
          'python-semantic-release>=10,<11'

      - name: Verify stable branch
        run: >-
          python -m ruff format --check .
          && python -m ruff check .
          && python -m mypy
          && python -m pytest
          && python -m build

      - name: Determine version and create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          rm -rf dist
          && semantic-release version

      - name: Create GitHub release with distribution assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          if git describe --tags --exact-match >/dev/null 2>&1; then
            tag=$(git describe --tags --exact-match) && gh release create "$tag" dist/* --title "$tag" --generate-notes;
          else
            echo "No release version was created for this commit.";
          fi
