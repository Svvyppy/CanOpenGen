name: Feature request
description: Propose a focused improvement to CanOpenGen.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the embedded/CANopen workflow that needs improvement.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected YAML, CLI, generated output, or integration behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - No public behavior change
        - Backward-compatible public addition
        - Potential YAML or generated-interface break
        - Unsure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context

