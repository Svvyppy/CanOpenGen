[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "canopengen"
version = "0.1.0"
description = "Declarative CANopen Object Dictionary generation from YAML"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "CanOpenGen contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "jsonschema>=4.23",
  "PyYAML>=6.0.2",
]

[project.scripts]
canopengen = "canopengen.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0.12",
]

[project.urls]
Homepage = "https://github.com/Svvyppy/CanOpenGen"
Documentation = "https://github.com/Svvyppy/CanOpenGen/wiki"
Issues = "https://github.com/Svvyppy/CanOpenGen/issues"
Repository = "https://github.com/Svvyppy/CanOpenGen.git"

[tool.hatch.build.targets.wheel]
packages = ["canopengen"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/canopengen.schema.json" = "canopengen/schemas/canopengen.schema.json"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "ISC",
  "N",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["canopengen", "tests"]

[tool.semantic_release]
allow_zero_version = true
build_command = "python -m build"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
major_on_zero = true
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["canopengen/__init__.py:__version__"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
name = "origin"
type = "github"
